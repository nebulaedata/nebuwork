name: nebu-engine-v2-test
services:
  mysql:
    image: mysql:8.0.32
    environment:
      MYSQL_ROOT_PASSWORD: isolated-test-password
      MYSQL_DATABASE: agent_test
    ports: ["127.0.0.1:43306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pisolated-test-password"]
      interval: 2s
      timeout: 2s
      retries: 60
    volumes: ["test_mysql:/var/lib/mysql"]
  redis:
    image: redis:7.0-alpine
    ports: ["127.0.0.1:46379:6379"]
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: isolated-test
      MINIO_ROOT_PASSWORD: isolated-test-password
    ports: ["127.0.0.1:49000:9000"]
    volumes: ["test_objects:/data"]
volumes:
  test_mysql:
  test_objects:
