name: nebu-agent-engine-v2-0-0
x-environment: &environment
  DATABASE_URL: ${DATABASE_URL:?required}
  REDIS_URL: ${REDIS_URL:?required}
  REDIS_CHANNEL_PREFIX: ${REDIS_CHANNEL_PREFIX:-nebu-agent-engine}
  S3_ENDPOINT: ${S3_ENDPOINT:?required}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:?required}
  S3_PREFIX: ${S3_PREFIX:-nebu-agent-engine}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?required}
  ENGINE_SIGNING_KEY: ${ENGINE_SIGNING_KEY:?required}
  BUSINESS_API_URL: ${BUSINESS_API_URL:?required}
  BUSINESS_API_KEY: ${BUSINESS_API_KEY:?required}
  SANDBOX_IMAGE: ${SANDBOX_IMAGE:-nebu-agent-sandbox:1}
  FILE_TRANSFERS_ENABLED: ${FILE_TRANSFERS_ENABLED:-false}
  FILE_UPLOAD_TTL_MS: ${FILE_UPLOAD_TTL_MS:-86400000}
  FILE_PREVIEW_TTL_MS: ${FILE_PREVIEW_TTL_MS:-604800000}
x-app: &app
  image: nebu-agent-engine:2.0.0
  build: {context: ..}
  restart: unless-stopped
  extra_hosts: ["host.docker.internal:host-gateway"]
  depends_on:
    migrate: {condition: service_completed_successfully}
services:
  platform-mcp:
    profiles: [platform-mcp]
    image: nebu-agent-engine:2.0.0
    build: {context: ..}
    command: node dist/platform-mcp-main.js
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      BUSINESS_API_URL: ${BUSINESS_API_URL:?required}
      PLATFORM_MCP_SERVICE_KEY: ${PLATFORM_MCP_SERVICE_KEY:-}
      PLATFORM_MCP_HOST: 0.0.0.0
      PLATFORM_MCP_PORT: "42120"
    ports: ["127.0.0.1:42120:42120"]
  migrate:
    image: nebu-agent-engine:2.0.0
    build: {context: ..}
    command: node dist/migrate.js
    environment: *environment
  api1:
    <<: *app
    environment: {<<: *environment, ENGINE_ROLE: api}
    ports: ["127.0.0.1:42110:42110"]
  api2:
    <<: *app
    environment: {<<: *environment, ENGINE_ROLE: api}
    ports: ["127.0.0.1:42111:42110"]
  worker:
    <<: *app
    environment: {<<: *environment, ENGINE_ROLE: worker, WORKER_CONCURRENCY: "2"}
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    deploy: {replicas: 3}
