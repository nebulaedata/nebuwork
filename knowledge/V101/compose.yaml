name: nebulaekno
services:
  app:
    image: nebulaekno:0.1.0
    build: .
    env_file: .env
    environment:
      NEBULAEKNO_EXTRACTION_URL: http://extraction:${NEBULAEKNO_EXTRACTION_CONTAINER_PORT:-8082}
    ports:
      - "${NEBULAEKNO_PORT:-8080}:${NEBULAEKNO_PORT:-8080}"
    volumes:
      - data:/data
    restart: on-failure:5
    stop_grace_period: 30s
    mem_limit: 8g
    cpus: 4
  extraction:
    image: nebulaekno-extraction:0.1.0
    build:
      context: .
      dockerfile: Dockerfile.extraction
    env_file: .env
    environment:
      NEBULAEKNO_PORT: ${NEBULAEKNO_EXTRACTION_CONTAINER_PORT:-8082}
      NEBULAEKNO_MAIN_API_URL: http://app:${NEBULAEKNO_PORT:-8080}
    ports:
      - "127.0.0.1:${NEBULAEKNO_EXTRACTION_PORT:-19082}:${NEBULAEKNO_EXTRACTION_CONTAINER_PORT:-8082}"
    volumes:
      - data:/data
    depends_on:
      app: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 4g
    cpus: 2
volumes:
  data:
